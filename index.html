<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peter Stražar</title>
  <meta name="description" content="Peter Stražar — projects, writing, offers and contact.">
  <meta name="theme-color" content="#0b0c0e">
  <script>
    // Set theme + language before first paint
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "light") document.documentElement.classList.remove("dark");
        var l = localStorage.getItem("lang") || ((navigator.language || "").toLowerCase().indexOf("sl") === 0 ? "sl" : "en");
        document.documentElement.lang = l;
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main" data-i18n="skip"></a>

  <header class="nav">
    <div class="container nav-inner">
      <a class="brand" href="#top">Peter Stražar<span class="dot">.</span></a>
      <nav class="nav-links" id="nav-links" aria-label="Main">
        <a class="nav-link" href="#about" data-i18n="nav.about"></a>
        <a class="nav-link" href="#projects" data-i18n="nav.projects"></a>
        <a class="nav-link" href="#writing" data-i18n="nav.writing"></a>
        <a class="nav-link" href="#offers" data-i18n="nav.offers"></a>
        <a class="nav-link" href="#contact" data-i18n="nav.contact"></a>
      </nav>
      <div class="nav-tools">
        <div class="lang" role="group" aria-label="Language">
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="sl">SL</button>
        </div>
        <button type="button" class="icon-btn" id="theme-toggle" aria-label="Toggle theme">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button type="button" class="icon-btn menu-btn" id="menu-toggle" aria-label="Menu" aria-expanded="false" aria-controls="nav-links">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="hero" id="top">
      <div class="hero-glow" aria-hidden="true"></div>
      <div class="container">
        <p class="label-eyebrow rise" data-i18n="hero.eyebrow"></p>
        <h1 class="display rise" style="--d:60ms">Peter Stražar</h1>
        <p class="lead rise" style="--d:120ms" data-i18n="hero.lead"></p>
        <div class="hero-actions rise" style="--d:180ms">
          <a class="btn btn-primary" href="#projects" data-i18n="hero.cta"></a>
          <a class="btn btn-ghost" href="#contact" data-i18n="hero.cta2"></a>
        </div>
      </div>
    </section>

    <section class="section" id="about">
      <div class="container split">
        <div class="reveal">
          <p class="label-eyebrow" data-i18n="about.eyebrow"></p>
          <h2 data-i18n="about.title"></h2>
        </div>
        <div class="reveal prose">
          <p class="lead" data-i18n="about.p1"></p>
          <p data-i18n="about.p2"></p>
          <dl class="facts" id="facts"></dl>
        </div>
      </div>
    </section>

    <section class="section" id="projects">
      <div class="container">
        <div class="section-head reveal">
          <p class="label-eyebrow" data-i18n="projects.eyebrow"></p>
          <h2 data-i18n="projects.title"></h2>
        </div>
        <div class="grid grid-3" id="project-list"></div>
      </div>
    </section>

    <section class="section" id="writing">
      <div class="container">
        <div class="section-head reveal">
          <p class="label-eyebrow" data-i18n="writing.eyebrow"></p>
          <h2 data-i18n="writing.title"></h2>
        </div>
        <ul class="posts" id="post-list"></ul>
      </div>
    </section>

    <section class="section" id="offers">
      <div class="container">
        <div class="section-head reveal">
          <p class="label-eyebrow" data-i18n="offers.eyebrow"></p>
          <h2 data-i18n="offers.title"></h2>
        </div>
        <div class="grid grid-3" id="offer-list"></div>
      </div>
    </section>

    <section class="section" id="contact">
      <div class="container">
        <div class="contact-card reveal">
          <p class="label-eyebrow" data-i18n="contact.eyebrow"></p>
          <h2 data-i18n="contact.title"></h2>
          <p class="lead" data-i18n="contact.lead"></p>
          <a class="btn btn-primary" id="email-link" href="#"></a>
          <ul class="socials" id="social-list"></ul>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <span>© <span id="year"></span> Peter Stražar</span>
      <a href="#top" data-i18n="footer.top"></a>
    </div>
  </footer>

  <script src="content.js"></script>
  <script src="script.js"></script>
</body>
</html>
